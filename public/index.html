<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todoアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Todoリスト</h1>
    <div class="sort-container">
      <label for="sort-select">並び替え：</label>
      <select id="sort-select">
        <option value="newest">新しい順</option>
        <option value="oldest">古い順</option>
        <option value="incomplete">未完了を優先</option>
      </select>
  </div>
    <form id="todo-form">
      <input type="text" id="todo-title" placeholder="新しいTodoを入力..." required>
      <button type="submit">追加</button>
    </form>

    <h2>未完了のTodo</h2>
    <p id="active-empty-message">未完了のTodoはありません</p>
    <ul id="active-todo-list"></ul>

    <h2>完了したTodo</h2>
    <p id="completed-empty-message">完了したTodoはありません</p>
    <ul id="completed-todo-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
